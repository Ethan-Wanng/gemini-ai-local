<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{{.Title}}</title>
    <link href="templates/index.css" rel="stylesheet">
    <link href="templates/reading.css" rel="stylesheet">
    <link href="templates/video.css" rel="stylesheet">
    <link href="templates/sdk/http_cdnjs.cloudflare.com_ajax_libs_font-awesome_6.2.0_css_all.css" rel="stylesheet">
    <link href="templates/sdk/http_cdnjs.cloudflare.com_ajax_libs_highlight.js_11.8.0_styles_github.min.css"
          rel="stylesheet">
    <link href="templates/sdk/firacode_swap.css" rel="stylesheet">
    <link href="templates/sdk/notosans_swap.css" rel="stylesheet">
    <script src="templates/sdk/http_cdn.jsdelivr.net_npm_marked_marked.min.js"></script>
    <script src="templates/sdk/http_cdnjs.cloudflare.com_ajax_libs_highlight.js_11.8.0_highlight.min.js"></script>
    <script src="templates/sdk/http_cdnjs.cloudflare.com_ajax_libs_jspdf_2.5.1_jspdf.umd.js"></script>
    <link href="favicon.ico" rel="icon" type="image/x-icon">
</head>
<body>
<span id="title">{{.Title}}</span>

<header>
    <div id="model-selector">
        <div class="dropdown-wrapper" title="选择模型">
            <button class="dropdown-btn" onclick="toggleDropdown()"></button>
            <select id="model-select" onchange="changeModel()">
                <option selected value="gemini-2.0-flash">gemini 2.0 flash</option>
                <option value="gemini-2.5-flash">gemini 2.5 flash</option>
                <option value="gemini-2.5-pro">gemini 2.5 pro</option>
                <option value="gemini-2.0-flash-exp">gemini 2.5 flash (图片)</option>
                <option value="gemini-exp-1206">gemini exp 1206</option>
                <option value="gemini-3.0-flash">gemini 3.0 flash</option>
            </select>
            <ul class="dropdown-list">
                <li onclick="selectOption('gemini-2.0-flash')">gemini 2.0 flash</li>
                <li onclick="selectOption('gemini-2.5-flash')">gemini 2.5 flash</li>
                <li onclick="selectOption('gemini-2.5-pro')">gemini 2.5 pro</li>
                <li onclick="selectOption('gemini-2.0-flash-exp')">gemini 2.0 flash (图片)</li>
                <li onclick="selectOption('gemini-exp-1206')">gemini exp 1206</li>
                <li onclick="selectOption('gemini-3.0-flash')">gemini 3.0 flash</li>
            </ul>
        </div>
        <button id="share" onclick="exportToMd()" title="分享">
            <i class="fas fa-share-from-square"></i>
        </button>
        <button id="history-toggle-btn" title="切换历史记录">
            <i class="fas fa-history"></i>
        </button>
        <button id="theme-toggle" title="切换主题">
            <i class="fas fa-sun"></i>
        </button>
<!--        <button id="play-video-btn" title="视频">-->
<!--            <i class="fas fa-play"></i>-->
<!--        </button>-->
<!--        <button id="play-reading-btn" title="小说">-->
<!--            <i class="fas fa-book-open"></i>-->
<!--        </button>-->
    </div>
</header>
<div id="main-container">
    <!-- 左侧聊天区域 -->
    <div id="chat-area">
        <div id="chat-container"></div>

        <div style="height: 48px">
            <button class="scroll-to-bottom-btn" id="scroll-to-bottom" onclick="scrollToBottom()" title="滚动到底部">
                <i class="fas fa-arrow-down"></i>
            </button>
        </div>

        <div id="input-container">
            <button id="new-conversation-button" onclick="startNewConversation()" title="新对话">
                <i class="fas fa-comment-dots"></i>
            </button>
            <label for="file-input" id="select-file-label" title="上传文件">
                <i class="fas fa-plus"></i>
            </label>
            <input id="file-input" multiple onchange="handleFiles(this.files)" style="display: none;" type="file">
            <div id="fileInfo" style="display: none"></div>
            <textarea id="user-input"
                      oninput="adjustTextareaHeight()"
                      onpaste="handlePaste(event)"
                      placeholder="在这里输入您的问题或粘贴文件内容..."
            ></textarea>
            <button id="send-button" onclick="sendMessage(false)">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <span id="model-name-display">gemini-2.0-flash</span>
    </div>

    <!-- 右侧历史记录容器 -->
    <div id="history-container">
        <div id="history-header">
            <h3 id="history-title"></h3>
            <div id="list-actions"></div> <!-- 这个div用来放置右侧的加号按钮 -->
        </div>
        <ul id="history-list"></ul>
    </div>
</div>

<!-- Video Player Container -->
<div id="media-player-container" style="display: none;">
    <div id="media-player-drag-handle">
        <button id="media-player-hide-btn" title="隐藏播放器"><i class="fas fa-eye-slash"></i></button>
        <button id="media-player-close-btn" title="关闭播放器"><i class="fas fa-times"></i></button>
    </div>
    <div id="media-content-area">

    </div>
    <div id="media-player-resize-handle"></div>
</div>


<!-- General Modal -->
<div class="modal" id="general-modal" style="display:none;">
    <div class="modal-content">
        <span class="close-modal-btn" onclick="closeGeneralModal()">×</span>
        <h3 id="modal-title">Modal Title</h3>
        <div id="modal-body">

        </div>
        <div id="modal-actions">

        </div>
    </div>
</div>

<div class="modal-overlay" id="addVideoModal" style="display: none;">
    <div class="modal-content">
        <h3>添加视频</h3>
        <label for="add-video-title">标题:</label>
        <input id="add-video-title" placeholder="视频标题" type="text">

        <label for="add-video-source-type">来源:</label>
        <select id="add-video-source-type">
            <option value="youtube">YouTube URL</option>
            <option value="local">本地文件</option>
        </select>

        <div id="video-url-input">
            <label for="add-video-url">YouTube URL:</label>
            <input id="add-video-url" placeholder="https://www.youtube.com/watch?v=..." type="text">
        </div>

        <div id="video-file-input" style="display: none;">
            <label for="add-video-file">选择本地视频文件:</label>
            <input accept="video/*" id="add-video-file" type="file">
        </div>

        <div class="modal-actions">
            <button class="btn btn-primary" id="submit-add-video">添加</button>
            <button class="btn btn-secondary" id="cancel-add-video">取消</button>
        </div>
    </div>
</div>

<!-- Add Read Modal -->
<div class="modal-overlay" id="addReadModal" style="display: none;">
    <div class="modal-content">
        <h3>添加小说</h3>
        <label for="add-read-title">标题 (可选):</label>
        <input id="add-read-title" placeholder="小说标题 (如果和文件名不同)" type="text">

        <label for="add-read-file">选择小说文件:</label>
        <input accept=".txt,.epub,.pdf" id="add-read-file" type="file">

        <div class="modal-actions">
            <button class="btn btn-primary" id="submit-add-read">添加</button>
            <button class="btn btn-secondary" id="cancel-add-read">取消</button>
        </div>
    </div>
</div>

<!-- YouTube API Script -->
<script src="https://www.youtube.com/iframe_api"></script>
<script src="templates/index.js"></script>
<script src="templates/reading.js"></script>
<script src="templates/video.js"></script>
</body>
</html>
